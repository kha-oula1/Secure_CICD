name: CI

on:
  push:
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: dentalflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate container
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build commit-tagged image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            ./backend

      - name: Compile Python source
        run: |
          docker run --rm \
            --entrypoint python \
            "$IMAGE_NAME:$GITHUB_SHA" \
            -m compileall -q /app/app

      - name: Start smoke-test container
        run: |
          docker run --detach \
            --name dentalflow-ci \
            --publish 127.0.0.1:8000:8000 \
            --env DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci \
            --env JWT_SECRET=ci-only-not-a-production-secret \
            --env AWS_ACCESS_KEY_ID=testing \
            --env AWS_SECRET_ACCESS_KEY=testing \
            "$IMAGE_NAME:$GITHUB_SHA"

          echo "Container status:"
          docker ps -a

          echo "Initial container logs:"
          docker logs dentalflow-ci || true

      - name: Verify health endpoint
        run: |
          for attempt in {1..10}; do
            echo "Health check attempt $attempt/10"

            response="$(curl --silent --show-error http://127.0.0.1:8000/health || true)"

            echo "Response: $response"

            if [[ "$response" == '{"status":"ok"}' ]]; then
              echo "DentalFlow health check passed"
              exit 0
            fi

            sleep 2
          done

          echo "DentalFlow health check failed"
          echo "Final container status:"
          docker ps -a

          echo "Final container logs:"
          docker logs dentalflow-ci || true

          exit 1

      - name: Show logs and remove smoke-test container
        if: always()
        run: |
          docker logs dentalflow-ci || true
          docker rm --force dentalflow-ci || true

  publish:
    name: Publish container
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build and push release image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE_ID:$GITHUB_SHA" \
            --tag "$IMAGE_ID:latest" \
            ./backend

          docker push "$IMAGE_ID:$GITHUB_SHA"
          docker push "$IMAGE_ID:latest"