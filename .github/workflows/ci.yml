on:
  push:
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: dentalflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate container
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build commit-tagged image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            ./backend

      - name: Compile Python source
        run: |
          docker run --rm \
            --entrypoint python \
            "$IMAGE_NAME:$GITHUB_SHA" \
            -m compileall -q /app/app

      - name: Start smoke-test container
        run: |
          docker run --detach \
            --name dentalflow-ci \
            --publish 127.0.0.1:8000:8000 \
            "$IMAGE_NAME:$GITHUB_SHA"

      - name: Verify health endpoint
        run: |
          for attempt in {1..10}; do
            response="$(curl --fail --silent http://127.0.0.1:8000/health || true)"
            if [[ "$response" == '{"status":"ok"}' ]]; then
              echo "DentalFlow health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "DentalFlow health check failed"
          exit 1

      - name: Show logs and remove smoke-test container
        if: always()
        run: |
          docker logs dentalflow-ci || true
          docker rm --force dentalflow-ci || true